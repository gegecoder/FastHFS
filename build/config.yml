# This file contains the configuration for this project.
# GENERATED from template/build/config.yml.template — do not edit this file directly.
# Edit template/build/config.yml.template or app.config.json, then run
# `wails3 task generate:build:config` (also runs automatically before build/package).
# info.json / Info.plist / nfpm.yaml 同样由该脚本生成，因此不要再运行
# `wails3 task common:update:build-assets`，否则会覆盖模板生成的结果。
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "心歌"
  productName: "FastHFS"
  productIdentifier: "com.fasthfs.app"
  description: "HTTP 文件服务"
  copyright: "(c) 2026, 心歌"
  comments: "HTTP 文件服务"
  version: "1.0.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - webshare
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# Windows 使用原生文件对话框，不配置文件关联
fileAssociations: []
other: []
